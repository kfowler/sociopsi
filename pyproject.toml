[project]
name = "sociopsi"
version = "0.1.0"
description = "Jungian cognitive architecture with homeostatic drives"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.9",
    "textual>=0.48.0",
    "rich>=13.7.0",
    "psutil>=5.9.8",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.14",
    "pyright>=1.1.348",
    "pytest>=7.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
