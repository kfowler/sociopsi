[project]
name = "sociopsi"
version = "0.1.0"
description = "A Jungian cognitive architecture for silicon consciousness"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "K Fowler" }
]
keywords = ["agent", "ai", "consciousness", "jungian", "psyche", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ollama>=0.4.0,<1.0.0",
    "psutil>=6.0.0,<7.0.0",
    "pyobjc>=12.1,<13.0.0; sys_platform == 'darwin'",
    "pyttsx3>=2.90,<3.0.0; sys_platform == 'linux'",
    "opencv-python>=4.9.0,<5.0.0",
    "sounddevice>=0.4.6,<0.5.0",
    "soundfile>=0.12.0,<0.13.0",
    "numpy>=1.26.0,<3.0.0",
    "sentence-transformers>=2.2.0,<3.0.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0,<1.0.0",
]
linux = [
    "vosk>=0.3.45,<0.4.0",
    "sounddevice>=0.4.6,<0.5.0",
]

[project.urls]
Homepage = "https://github.com/kfowler/sociopsi"
Repository = "https://github.com/kfowler/sociopsi"
Issues = "https://github.com/kfowler/sociopsi/issues"

[project.scripts]
sociopsi = "sociopsi.main:main"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sociopsi"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["sociopsi"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingImports = false
reportMissingModuleSource = false
reportAttributeAccessIssue = "none"  # PyObjC/AVFoundation lacks type stubs

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.1",
    "ruff>=0.8.0,<1.0.0",
    "pyright>=1.1.390,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
]
